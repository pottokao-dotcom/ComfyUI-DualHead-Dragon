# Builds the bundled llama.cpp + libdh_spec (CPU backend: the runners have no GPU) and checks that the node can load
# them: the speculative-decoding exports on Windows (dh_spec.dll) are the point -- they are not tested anywhere else.
name: build-check
on:
  workflow_dispatch:
  push:
    branches: [vendor-upgrade, main]
    paths: [native/**, build.py, vendor/**, dh_llama/**, dh_backend.py, .github/workflows/build-check.yml]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python deps of the bindings
        run: python -m pip install typing_extensions numpy
      - name: build (CPU backend)
        run: python build.py --backend cpu --portable-cpu --jobs 4
      - name: dh_spec.dll dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul
          dumpbin /dependents dh_llama\lib\dh_spec.dll
          dir dh_llama\lib
      - name: load the libraries the way the node does
        shell: python
        run: |
          # same order as the node: the bindings add dh_llama/lib to the DLL search path (Windows), then dh_backend
          # loads dh_spec from LIB_DIR by absolute path
          import ctypes, os, sys
          sys.path.insert(0, os.getcwd())
          from dh_llama import llama_cpp, LIB_DIR
          print(sorted(os.listdir(LIB_DIR)))
          llama_cpp.llama_backend_init()
          print("llama.cpp bindings load, default n_ctx =", llama_cpp.llama_context_default_params().n_ctx)
          name = {"win32": "dh_spec.dll", "darwin": "libdh_spec.dylib"}.get(sys.platform, "libdh_spec.so")
          if sys.platform == "win32":  # as dh_backend._spec_lib does
              spec = ctypes.CDLL(os.path.join(LIB_DIR, name), winmode=0x00000008)
          else:
              spec = ctypes.CDLL(os.path.join(LIB_DIR, name))
          for fn in ("dh_spec_create", "dh_spec_generate", "dh_spec_free", "dh_spec_type"):
              getattr(spec, fn)  # raises if not exported
              print("exported:", fn)
